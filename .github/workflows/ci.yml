name: Verify WageInsight
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm --dir client install --frozen-lockfile
      - run: pnpm --dir client test
      - run: pnpm --dir client build
      - run: pnpm --dir client exec playwright install --with-deps chromium
      - run: pnpm --dir client exec playwright test
      - run: pnpm --dir client exec playwright test --config playwright.explanations.config.ts
