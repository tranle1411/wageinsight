name = "wageinsight-explanations"
main = "src/index.ts"
compatibility_date = "2026-10-08"
[ai]
binding = "AI"
[vars]
ALLOWED_ORIGIN = "https://wageinsight.chantranle-2026.workers.dev"
TURNSTILE_HOSTNAME = "wageinsight.chantranle-2026.workers.dev"
EXPLANATIONS_ENABLED = "true"

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1411001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "AI_LIMITER"
